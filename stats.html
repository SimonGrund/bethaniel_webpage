<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Conversions — Betty</title>
    <link rel="icon" type="image/svg+xml" href="Public/logo-icon.svg" />
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      rel="stylesheet"
      href="https://fonts.bunny.net/css?family=cormorant-garamond:400,600,700&family=inter:400,500,600&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      .stats { max-width: 60rem; margin: 0 auto; padding: 3rem var(--pad-x); }
      .stats h1 { font-family: var(--serif); font-size: 2.5rem; color: var(--heading); }
      .stats__gate { max-width: 22rem; margin-top: 2rem; }
      .stats__gate input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border);
        border-radius: var(--radius); background: var(--bg); font-family: var(--sans); }
      .stats__error { color: #a04040; margin-top: 0.75rem; }
      .stats__ranges { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 2rem 0 1.5rem; }
      .stats__tiles { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 2.5rem; }
      .stats__tile { background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius-lg); padding: 1.25rem 1.75rem; min-width: 9rem; }
      .stats__tile b { display: block; font-family: var(--serif); font-size: 2.25rem;
        line-height: 1.1; color: var(--heading); }
      .stats__tile span { color: var(--muted); font-size: 0.85rem; }
      .stats h2 { font-family: var(--serif); font-size: 1.5rem; margin: 2rem 0 0.75rem; }
      .stats table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
      .stats th, .stats td { text-align: left; padding: 0.5rem 0.75rem;
        border-bottom: 1px solid var(--border); }
      .stats th { color: var(--muted); font-weight: 500; }
      .stats td.num, .stats th.num { text-align: right; font-variant-numeric: tabular-nums; }
      .stats__empty { color: var(--muted); font-style: italic; }
      .stats__wrap { overflow-x: auto; }
      .stats__signout { margin-top: 2.5rem; color: var(--muted); font-size: 0.85rem; }
      .stats__signout button { background: none; border: 0; padding: 0; color: var(--muted);
        font: inherit; text-decoration: underline; cursor: pointer; }
      .stats__signout button:hover { color: var(--text); }
      .stats__delcol { width: 2rem; }
      .stats__delcell { text-align: right; }
      .stats__delbtn { width: 1.75rem; height: 1.75rem; padding: 0; line-height: 1;
        background: none; border: 1px solid var(--border); border-radius: var(--radius);
        color: var(--muted); font: inherit; cursor: pointer; }
      .stats__delbtn:hover { color: var(--text); border-color: var(--muted); }
      .stats__delconfirm { background: var(--surface); border-radius: var(--radius); }
      .stats__delmsg { margin: 0 0 0.6rem; }
      .stats__delfields { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
      .stats__delfields label { color: var(--muted); font-size: 0.85rem; }
      .stats__delfields input { padding: 0.4rem 0.6rem; border: 1px solid var(--border);
        border-radius: var(--radius); background: var(--bg); font-family: var(--sans); width: 8rem; }
      .stats__delerror { color: #a04040; margin: 0.6rem 0 0; }
      .stats__note { color: var(--muted); font-size: 0.85rem; margin: 0.5rem 0 1.5rem; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <main class="stats">
      <h1>Conversions</h1>

      <form class="stats__gate" id="gate">
        <label for="pw">Password</label>
        <input type="password" id="pw" autocomplete="current-password" required />
        <p class="stats__error" id="gateError" hidden></p>
      </form>

      <div id="panel" hidden>
        <div class="stats__ranges">
          <button class="btn btn-outline" data-days="7">7 days</button>
          <button class="btn btn-outline" data-days="30">30 days</button>
          <button class="btn btn-outline" data-days="90">90 days</button>
          <input type="date" id="from" /> <input type="date" id="to" />
          <button class="btn btn-outline" id="applyRange">Apply</button>
        </div>

        <div class="stats__tiles">
          <div class="stats__tile"><b id="tDownloads">—</b><span>downloads</span></div>
          <div class="stats__tile"><b id="tEnquiries">—</b><span>enquiries</span></div>
          <div class="stats__tile"><b id="tRange">—</b><span>range</span></div>
        </div>

        <h2>By campaign</h2>
        <p class="stats__note" id="deleteNote" hidden></p>
        <div class="stats__wrap">
          <table>
            <thead>
              <tr>
                <th>Source</th><th>Medium</th><th>Campaign</th>
                <th class="num">Downloads</th><th class="num">Enquiries</th>
                <th class="stats__delcol"><span class="visually-hidden">Actions</span></th>
              </tr>
            </thead>
            <tbody id="campaignRows"></tbody>
          </table>
        </div>

        <h2>By platform</h2>
        <div class="stats__wrap">
          <table>
            <thead><tr><th>Platform</th><th class="num">Downloads</th><th class="num">Enquiries</th></tr></thead>
            <tbody id="platformRows"></tbody>
          </table>
        </div>

        <h2>By installer</h2>
        <div class="stats__wrap">
          <table>
            <thead><tr><th>Installer</th><th class="num">Downloads</th></tr></thead>
            <tbody id="assetRows"></tbody>
          </table>
        </div>

        <h2>By day</h2>
        <div class="stats__wrap">
          <table>
            <thead>
              <tr><th>Date</th><th class="num">Downloads</th><th class="num">Enquiries</th></tr>
            </thead>
            <tbody id="dailyRows"></tbody>
          </table>
        </div>

        <p class="stats__signout">
          Signed in on this machine for 90 days.
          <button type="button" id="signOut">Sign out</button>
        </p>
      </div>
    </main>

    <script>
      (function () {
        const gate = document.getElementById("gate");
        const pw = document.getElementById("pw");
        const gateError = document.getElementById("gateError");
        const signOut = document.getElementById("signOut");
        const panel = document.getElementById("panel");
        const deleteNote = document.getElementById("deleteNote");
        let range = { days: 30 };
        /* The exact from/to sent with the last successful /api/stats
           request — reused as-is for a delete, so the deleted range always
           matches what is on screen, and shown in the confirmation text. */
        let lastQuery = null;

        function cell(text, numeric) {
          const td = document.createElement("td");
          td.textContent = text;
          if (numeric) td.className = "num";
          return td;
        }

        /* A column is normally [key, numeric?]: the cell is built from
           row[key] via textContent. A column may instead carry a third
           element, a render(row) function returning a whole <td> itself —
           used by the campaign table's trailing control column, which has
           no row field to read and needs interactive elements. */
        function buildRow(row, columns) {
          const tr = document.createElement("tr");
          for (const [key, numeric, render] of columns) {
            tr.append(render ? render(row) : cell(String(row[key]), numeric));
          }
          return tr;
        }

        /* Built with createElement/textContent rather than assigning raw
           markup: these values come from a public endpoint anyone can post
           to, so they are never treated as HTML. */
        function fill(tbody, rows, columns, emptyText) {
          tbody.replaceChildren();
          if (!rows.length) {
            const tr = document.createElement("tr");
            const td = document.createElement("td");
            td.colSpan = columns.length;
            td.className = "stats__empty";
            td.textContent = emptyText;
            tr.append(td);
            tbody.append(tr);
            return;
          }
          for (const row of rows) {
            tbody.append(buildRow(row, columns));
          }
        }

        function pluralize(n, singular, plural) {
          return `${n} ${n === 1 ? singular : plural}`;
        }

        /* The ✕ control for one campaign row. Deletes by the raw
           source/medium/campaign values (row.raw, which may be null),
           never by the displayed direct/none placeholders — those are
           display-only and a real campaign could legitimately be named
           "none". */
        function deleteCell(row) {
          const td = document.createElement("td");
          td.className = "stats__delcell";
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "stats__delbtn";
          btn.textContent = "✕";
          btn.setAttribute(
            "aria-label",
            `Delete rows for ${row.source} / ${row.medium} / ${row.campaign}`,
          );
          btn.addEventListener("click", () => {
            const tr = td.parentElement;
            tr.replaceWith(buildConfirmRow(row));
          });
          td.append(btn);
          return td;
        }

        const campaignColumns = [
          ["source"], ["medium"], ["campaign"],
          ["downloads", true], ["enquiries", true],
          ["__delete__", false, deleteCell],
        ];

        /* The inline confirmation that replaces a campaign row when its ✕
           is clicked — not a browser confirm() and not a modal. Cancelling
           rebuilds the plain row from the same data, no reload needed. */
        function buildConfirmRow(row) {
          const tr = document.createElement("tr");
          const td = document.createElement("td");
          td.colSpan = campaignColumns.length;
          td.className = "stats__delconfirm";

          const msg = document.createElement("p");
          msg.className = "stats__delmsg";
          msg.textContent = `Delete ${pluralize(row.downloads, "download", "downloads")} and ` +
            `${pluralize(row.enquiries, "enquiry", "enquiries")} for ${row.source} / ${row.medium} / ` +
            `${row.campaign}, ${lastQuery.from} to ${lastQuery.to}. This cannot be undone.`;

          const fields = document.createElement("div");
          fields.className = "stats__delfields";

          const label = document.createElement("label");
          const labelId = `delConfirmLabel-${Math.random().toString(36).slice(2)}`;
          label.id = labelId;
          label.textContent = 'Type "delete" to confirm';

          const input = document.createElement("input");
          input.type = "text";
          input.autocomplete = "off";
          input.setAttribute("aria-labelledby", labelId);

          const confirmBtn = document.createElement("button");
          confirmBtn.type = "button";
          confirmBtn.className = "btn btn-outline";
          confirmBtn.textContent = "Delete";
          confirmBtn.disabled = true;

          const cancelBtn = document.createElement("button");
          cancelBtn.type = "button";
          cancelBtn.className = "btn btn-outline";
          cancelBtn.textContent = "Cancel";

          input.addEventListener("input", () => {
            confirmBtn.disabled = input.value.trim().toLowerCase() !== "delete";
          });

          cancelBtn.addEventListener("click", () => {
            tr.replaceWith(buildRow(row, campaignColumns));
          });

          const errorP = document.createElement("p");
          errorP.className = "stats__delerror";
          errorP.hidden = true;

          confirmBtn.addEventListener("click", async () => {
            confirmBtn.disabled = true;
            errorP.hidden = true;
            try {
              const res = await fetch("/api/delete-events", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  password: readAuth(),
                  from: lastQuery.from,
                  to: lastQuery.to,
                  source: row.raw.source,
                  medium: row.raw.medium,
                  campaign: row.raw.campaign,
                }),
              });
              const payload = await res.json().catch(() => ({}));
              if (!res.ok) {
                errorP.textContent = payload.error || "Could not delete those rows.";
                errorP.hidden = false;
                confirmBtn.disabled = input.value.trim().toLowerCase() !== "delete";
                return;
              }
              deleteNote.hidden = false;
              deleteNote.textContent = `Deleted ${pluralize(payload.deleted, "row", "rows")}.`;
              /* Re-run the existing load so every table and the totals
                 reflect the deletion, not just this one row. */
              await load();
            } catch (e) {
              errorP.textContent = "Could not delete those rows.";
              errorP.hidden = false;
              confirmBtn.disabled = input.value.trim().toLowerCase() !== "delete";
            }
          });

          fields.append(label, input, confirmBtn, cancelBtn);
          td.append(msg, fields, errorP);
          tr.append(td);
          return tr;
        }

        function render(data) {
          document.getElementById("tDownloads").textContent = data.totals.downloads;
          document.getElementById("tEnquiries").textContent = data.totals.enquiries;
          document.getElementById("tRange").textContent = `${data.from} → ${data.to}`;
          fill(document.getElementById("campaignRows"), data.byCampaign, campaignColumns,
            "Nothing recorded in this range.");
          fill(document.getElementById("platformRows"), data.byPlatform,
            [["platform"], ["downloads", true], ["enquiries", true]],
            "Nothing recorded in this range.");
          fill(document.getElementById("assetRows"), data.byAsset,
            [["asset"], ["downloads", true]], "No downloads in this range.");
          fill(document.getElementById("dailyRows"), data.daily,
            [["date"], ["downloads", true], ["enquiries", true]],
            "No activity in this range.");
        }

        /* The password is kept in localStorage, not sessionStorage, so this
           machine stays signed in across browser restarts. It is a shared
           secret guarding aggregate counts on an internal page, and it sits on
           the operator's own device — but it does sit on disk, so anyone with
           access to this browser profile can read it. Sign out below to clear
           it, and the stored copy expires on its own after 90 days. */
        const AUTH_KEY = "betty_stats_auth";
        const AUTH_DAYS = 90;

        function saveAuth(password) {
          try {
            localStorage.setItem(AUTH_KEY, JSON.stringify({
              password,
              expires: Date.now() + AUTH_DAYS * 86400000,
            }));
          } catch (e) {
            /* Storage unavailable: this session still works, it just will not
               be remembered. */
          }
        }

        function readAuth() {
          try {
            const raw = JSON.parse(localStorage.getItem(AUTH_KEY));
            if (!raw || typeof raw.password !== "string") return null;
            if (!(raw.expires > Date.now())) {
              clearAuth();
              return null;
            }
            return raw.password;
          } catch (e) {
            return null;
          }
        }

        function clearAuth() {
          try {
            localStorage.removeItem(AUTH_KEY);
          } catch (e) {}
        }

        function isoDaysAgo(days) {
          return new Date(Date.now() - days * 86400000).toISOString().slice(0, 10);
        }

        async function load() {
          const password = readAuth();
          if (!password) return;
          const body = { password };
          if (range.days) {
            /* parseRange treats `to` as inclusive, so a preset of N days must
               start N-1 days back from today to span exactly N dates. */
            body.from = isoDaysAgo(range.days - 1);
            body.to = new Date().toISOString().slice(0, 10);
          } else {
            body.from = range.from;
            body.to = range.to;
          }
          lastQuery = { from: body.from, to: body.to };

          const res = await fetch("/api/stats", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });

          if (res.status === 403) {
            clearAuth();
            panel.hidden = true;
            gate.hidden = false;
            gateError.hidden = false;
            gateError.textContent = "That password did not work.";
            return;
          }
          if (!res.ok) {
            gateError.hidden = false;
            gateError.textContent = "Could not read the numbers. Try again.";
            return;
          }

          gate.hidden = true;
          gateError.hidden = true;
          panel.hidden = false;
          render(await res.json());
        }

        gate.addEventListener("submit", (e) => {
          e.preventDefault();
          saveAuth(pw.value);
          pw.value = "";
          load();
        });

        signOut.addEventListener("click", () => {
          clearAuth();
          panel.hidden = true;
          gate.hidden = false;
          gateError.hidden = true;
          pw.focus();
        });

        document.querySelectorAll("[data-days]").forEach((btn) => {
          btn.addEventListener("click", () => {
            range = { days: Number(btn.dataset.days) };
            deleteNote.hidden = true;
            load();
          });
        });

        document.getElementById("applyRange").addEventListener("click", () => {
          const from = document.getElementById("from").value;
          const to = document.getElementById("to").value;
          if (from && to) {
            range = { from, to };
            deleteNote.hidden = true;
            load();
          }
        });

        /* Remembered for 90 days on this machine, so a reload — or coming
           back next week — does not re-prompt. */
        if (readAuth()) load();
      })();
    </script>
  </body>
</html>
